
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foodie | Delicious Food</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #101010;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 8%;
      background: #181818;
    }

    .logo {
      color: #ff9f1c;
      font-size: 28px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 24px;
      font-weight: bold;
    }

    nav a:hover {
      color: #ff9f1c;
    }

    .hero {
      min-height: 85vh;
      display: flex;
      align-items: center;
      padding: 60px 8%;
      background:
        linear-gradient(90deg, #101010 25%, #101010aa),
        url("https://images.unsplash.com/photo-1571091718767-18b5b1457add?auto=format&fit=crop&w=1600&q=85")
        center/cover;
    }

    .hero-content {
      max-width: 600px;
    }

    .hero h1 {
      font-size: clamp(40px, 6vw, 72px);
      line-height: 1.1;
      margin: 20px 0;
    }

    .hero h1 span {
      color: #ff9f1c;
    }

    .hero p {
      color: #ddd;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 14px 26px;
      background: #ff9f1c;
      color: #111;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      margin-right: 10px;
      transition: 0.3s;
    }

    .btn:hover {
      background: white;
      transform: translateY(-3px);
    }

    .secondary {
      background: transparent;
      color: white;
      border: 1px solid white;
    }

    footer {
      text-align: center;
      padding: 24px;
      color: #aaa;
      background: #181818;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        gap: 18px;
      }

      nav a {
        margin: 0 8px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">🍔 Foodie.</div>
    <nav>
      <a href="index.html">Index</a>
      <a href="home.html">Home</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-content">
      <p>🍕 FRESH FOOD · FAST DELIVERY</p>
      <h1>Good Food.<br>Good Mood.<br><span>Delivered.</span></h1>
      <p>
        Discover delicious meals made with fresh ingredients.
        Order your favourites and enjoy happiness in every bite.
      </p>
      <a href="home.html" class="btn">Order Now →</a>
      <a href="contact.html" class="btn secondary">Contact Us</a>
    </div>
  </section>

  <footer>
    © 2026 Foodie. All rights reserved.
  </footer>

</body>
</html>
